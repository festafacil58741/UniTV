<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniTV | Download</title>
  <style>
    :root {
      --blue: #0a3f86;
      --blue-dark: #072e63;
      --blue-soft: #eaf2ff;
      --white: #ffffff;
      --text: #10213d;
      --muted: #6d7890;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 14%, rgba(10, 63, 134, 0.16), transparent 28%),
        linear-gradient(135deg, #ffffff 0%, var(--blue-soft) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      min-height: 560px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(10, 63, 134, 0.10);
      border-radius: 30px;
      box-shadow: 0 28px 80px rgba(7, 46, 99, 0.16);
      overflow: hidden;
      display: flex;
    }

    .content {
      width: 100%;
      padding: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      color: var(--blue);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    h1 {
      max-width: 500px;
      font-size: clamp(42px, 8vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 22px;
      color: var(--blue-dark);
    }

    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 34px;
      max-width: 390px;
    }

    .download {
      width: fit-content;
      min-height: 62px;
      padding: 0 36px;
      border-radius: 999px;
      background: var(--blue);
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 18px 36px rgba(10, 63, 134, 0.30);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .download:hover {
      transform: translateY(-2px);
      background: var(--blue-dark);
      box-shadow: 0 22px 44px rgba(10, 63, 134, 0.38);
    }

    .download span {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .page {
        min-height: 520px;
        border-radius: 22px;
      }

      .content {
        padding: 34px 22px;
      }

      .brand {
        margin-bottom: 34px;
      }

      p {
        font-size: 16px;
      }

      .download {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content">
      <div class="brand">UniTV</div>
      <h1>Baixe o aplicativo.</h1>
      <p>Acesso rápido pelo celular.</p>

      <a class="download" href="https://festafacil58741.github.io/festafacil/UniTV.apk" download>
        <span>↓</span>
        Download
      </a>
    </section>
  </main>
</body>
</html>
